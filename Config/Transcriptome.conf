[Data]
DataDir = 
OutDir = 
Rename = true
Renamefile = W261520T Control_1,W261521T Control_2,W261522T Control_3,W261523T UL21_1,W261524T UL21_2,W261525T UL21_3

# true：双端；false：单端
PE = true

[DataBase]
version = Mus_musculus.GRCm39
Genome_fa = ./Ensembl/Mus_musculus.GRCm39.dna.toplevel.fa
Genome_gft = ./Ensembl/Mus_musculus.GRCm39.113.gtf

# 第5步自动复制该目录下的 *function_id.txt、stats*.txt，以及启用名称映射时的 *function_id_name_all.txt。
Genome_annotation = ./Ensembl/Functional_annotation

# Gene_name_file 没有填 none
Gene_name = ./Ensembl/gene_name.txt

# KEGG 使用注释中的 KO 编号绘制 ko 通路；SYMBOL 使用基因名称及 Species 物种缩写。
gene_type = KEGG
Species = mmu

# snp 校正，如没有对应文件填 none
vcf_known_sites=none


[Sample_Info]
Group = Control=Control_1 Control_2 Control_3,UL21=UL21_1 UL21_2 UL21_3
DiffPeak_vs = UL21_vs_Control


[Report_Info]
Contract_Num = MDSW2026S0043
Project_Name = 中国科学院武汉病毒研究所娄静老师+6个小鼠PolyA法转录组测序
Report_Time = 20260901
company_name = 武汉迈荻生物科技有限公司